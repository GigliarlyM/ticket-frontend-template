<div class="ticket-list">
  <h2>Tickets</h2>
  <div class="ticket-form">
    <h3>Create Ticket</h3>
    <div>
      <label for="title">Title *</label>
      <input id="title" type="text" [(ngModel)]="newTitle" placeholder="Enter title" />
    </div>
    <div>
      <label for="description">Description</label>
      <textarea id="description" [(ngModel)]="newDescription" placeholder="Enter description"></textarea>
    </div>
    <button (click)="addTicket()">Add Ticket</button>
  </div>
  <div class="ticket-items">
    <app-ticket-card *ngFor="let ticket of tickets" [ticket]="ticket"></app-ticket-card>
  </div>
</div>
