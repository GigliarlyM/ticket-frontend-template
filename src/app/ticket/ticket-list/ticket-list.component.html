<div class="ticket-list-container">
  <h2>Criar Ticket</h2>
  <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Título *</label>
      <input id="title" type="text" formControlName="title" class="form-control" />
      <div *ngIf="ticketForm.get('title')?.invalid && ticketForm.get('title')?.touched" class="error">
        Título é obrigatório.
      </div>
    </div>
    <div class="form-group">
      <label for="description">Descrição</label>
      <textarea id="description" formControlName="description" class="form-control"></textarea>
    </div>
    <button type="submit" [disabled]="ticketForm.invalid">Criar Ticket</button>
  </form>

  <h2>Lista de Tickets</h2>
  <ul class="ticket-list">
    <li *ngFor="let ticket of tickets">
      <strong>{{ ticket.title }}</strong>
      <p *ngIf="ticket.description">{{ ticket.description }}</p>
      <small>Criado em: {{ ticket.createdAt | date:'short' }}</small>
    </li>
  </ul>
  <p *ngIf="tickets.length === 0">Nenhum ticket criado.</p>
</div>
