<form (ngSubmit)="onSubmit()" class="ticket-form">
  <div class="form-group">
    <label for="title">Título *</label>
    <input id="title" type="text" [(ngModel)]="title" name="title" required />
  </div>
  <div class="form-group">
    <label for="description">Descrição</label>
    <textarea id="description" [(ngModel)]="description" name="description"></textarea>
  </div>
  <button type="submit" [disabled]="!title.trim()">Criar Ticket</button>
</form>
